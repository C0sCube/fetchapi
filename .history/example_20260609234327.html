<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ETL Job Creator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            color: #334155;
        }

        .page-title {
            font-weight: 700;
            color: #0f172a;
        }

        .section-card {
            border: none;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        }

        .card-header {
            background: white;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-label-fixed {
            width: 140px;
            font-weight: 500;
            color: #475569;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .form-row .form-control,
        .form-row .form-select {
            flex: 1;
        }

        .day-btn {
            min-width: 65px;
        }

        .table td {
            vertical-align: middle;
        }

        .save-bar {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 15px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>

    <div class="container-fluid px-4 py-4">

        <h3 class="page-title mb-4">
            ETL Job Creator
        </h3>

        <!-- JOB DETAILS -->
        <div class="card section-card">

            <div class="card-header">
                Job Details
            </div>

            <div class="card-body">

                <div class="form-row">
                    <label class="form-label-fixed">
                        Job Name
                    </label>

                    <input class="form-control">
                </div>

                <div class="form-row">
                    <label class="form-label-fixed">
                        Description
                    </label>

                    <textarea class="form-control" rows="2"></textarea>
                </div>

            </div>
        </div>

        <!-- API CONFIG -->
        <div class="card section-card">

            <div class="card-header">
                API Configuration
            </div>

            <div class="card-body">

                <div class="form-row">
                    <label class="form-label-fixed">
                        Base URL
                    </label>

                    <input class="form-control">
                </div>

                <div class="form-row">
                    <label class="form-label-fixed">
                        Endpoint
                    </label>

                    <input class="form-control">
                </div>

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">
                            Method
                        </label>

                        <select class="form-select">
                            <option>GET</option>
                            <option>POST</option>
                            <option>PUT</option>
                            <option>PATCH</option>
                            <option>DELETE</option>
                        </select>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            Verify SSL
                        </label>

                        <select class="form-select">
                            <option>true</option>
                            <option>false</option>
                        </select>

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">
                            Timeout
                        </label>

                        <input class="form-control" value="20">

                    </div>

                </div>

            </div>
        </div>

        <!-- HEADERS -->
        <div class="card section-card">

            <div class="card-header">
                Headers
            </div>

            <div class="card-body">

                <table class="table table-bordered">

                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Value</th>
                            <th width="120">Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>
                                <input class="form-control">
                            </td>

                            <td>
                                <input class="form-control">
                            </td>

                            <td>
                                <button class="btn btn-danger btn-sm">
                                    Delete
                                </button>
                            </td>
                        </tr>

                    </tbody>

                </table>

                <button class="btn btn-outline-primary btn-sm">
                    + Add Header
                </button>

            </div>

        </div>

        <!-- PARAMETERS -->
        <div class="card section-card">

            <div class="card-header">
                Parameters
            </div>

            <div class="card-body">

                <table class="table table-bordered">

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Location</th>
                            <th>Required</th>
                            <th>Value</th>
                            <th width="100">Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>

                            <td>
                                <input class="form-control">
                            </td>

                            <td>
                                <select class="form-select">
                                    <option>str</option>
                                    <option>int</option>
                                    <option>float</option>
                                    <option>bool</option>
                                    <option>date</option>
                                    <option>datetime</option>
                                    <option>list</option>
                                </select>
                            </td>

                            <td>
                                <select class="form-select">
                                    <option>query</option>
                                    <option>body</option>
                                    <option>header</option>
                                    <option>path</option>
                                </select>
                            </td>

                            <td class="text-center">
                                <input type="checkbox">
                            </td>

                            <td>
                                <input class="form-control">
                            </td>

                            <td>
                                <button class="btn btn-danger btn-sm">
                                    Delete
                                </button>
                            </td>

                        </tr>

                    </tbody>

                </table>

                <button class="btn btn-outline-primary btn-sm">
                    + Add Parameter
                </button>

            </div>

        </div>

        <!-- OUTPUT -->
        <div class="card section-card">

            <div class="card-header">
                Output
            </div>

            <div class="card-body">

                <div class="form-row">
                    <label class="form-label-fixed">
                        Filename
                    </label>

                    <input class="form-control">
                </div>

                <div class="row">

                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-medium">
                                Format
                            </label>

                            <select class="form-select">
                                <option>csv</option>
                                <option>excel</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-medium">
                                Mode
                            </label>

                            <select class="form-select">
                                <option>single_sheet</option>
                                <option>multiple_sheet</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-medium">
                                Timestamp
                            </label>

                            <select class="form-select">
                                <option>true</option>
                                <option>false</option>
                            </select>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <!-- SCHEDULER -->
        <div class="card section-card">

            <div class="card-header">
                Scheduler
            </div>

            <div class="card-body">

                <div class="row mb-3">

                    <div class="col-md-4">
                        <label>Enable</label>
                        <select class="form-select">
                            <option>true</option>
                            <option>false</option>
                        </select>
                    </div>

                    <div class="col-md-8">
                        <label>Timezone</label>
                        <input class="form-control" value="Asia/Kolkata">
                    </div>

                </div>

                <label class="form-label">
                    Days
                </label>

                <div class="mb-3">

                    <button class="btn btn-outline-primary day-btn">Mon</button>
                    <button class="btn btn-outline-primary day-btn">Tue</button>
                    <button class="btn btn-outline-primary day-btn">Wed</button>
                    <button class="btn btn-outline-primary day-btn">Thu</button>
                    <button class="btn btn-outline-primary day-btn">Fri</button>
                    <button class="btn btn-outline-primary day-btn">Sat</button>
                    <button class="btn btn-outline-primary day-btn">Sun</button>

                </div>

                <label class="form-label">
                    Times
                </label>

                <div class="row">

                    <div class="col-md-3">
                        <input type="time" class="form-control">
                    </div>

                </div>

                <button class="btn btn-outline-primary btn-sm mt-2">
                    + Add Time
                </button>

            </div>

        </div>

        <!-- MAILER -->
        <div class="card section-card">

            <div class="card-header">
                Mailer
            </div>

            <div class="card-body">

                <div class="row mb-3">

                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-medium">
                                Enable
                            </label>

                            <select class="form-select">
                                <option>true</option>
                                <option>false</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-medium">
                                Notify Success
                            </label>

                            <select class="form-select">
                                <option>true</option>
                                <option>false</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-medium">
                                Notify Failure
                            </label>

                            <select class="form-select">
                                <option>true</option>
                                <option>false</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="form-row">
                    <label class="form-label-fixed">
                        Sender
                    </label>

                    <input class="form-control">
                </div>

                <div class="form-row">
                    <label class="form-label-fixed">
                        Recipients To
                    </label>

                    <input class="form-control">
                </div>

                <div class="form-row">
                    <label class="form-label-fixed">
                        Recipients CC
                    </label>

                    <input class="form-control">
                </div>

            </div>

        </div>

        <div class="save-bar text-end">
            <button class="btn btn-primary btn-lg">
                Save Job
            </button>
        </div>

    </div>

</body>

</html>
