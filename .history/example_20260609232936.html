<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETL Job Creator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            color: #334155;
        }

        .page-title {
            font-weight: 700;
            color: #0f172a;
        }

        .section-card {
            border: none;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: #0f172a;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .section-spacing {
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <h2 class="page-title mb-4">
        ETL Job Creator
    </h2>

    <!-- Job Details -->
    <div class="card section-card">
        <div class="card-header">
            Job Details
        </div>

        <div class="card-body">

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="jobName">
                <label>Job Name</label>
            </div>

            <div class="form-floating">
                <textarea class="form-control" style="height:120px"></textarea>
                <label>Description</label>
            </div>

        </div>
    </div>

    <!-- API Configuration -->
    <div class="card section-card">
        <div class="card-header">
            API Configuration
        </div>

        <div class="card-body">

            <div class="form-floating mb-3">
                <input type="text" class="form-control">
                <label>Base URL</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control">
                <label>Endpoint</label>
            </div>

            <div class="row">

                <div class="col-md-4">
                    <label class="form-label">Method</label>

                    <select class="form-select">
                        <option>GET</option>
                        <option>POST</option>
                        <option>PUT</option>
                        <option>PATCH</option>
                        <option>DELETE</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Verify SSL</label>

                    <select class="form-select">
                        <option>true</option>
                        <option>false</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Timeout</label>

                    <input type="number" class="form-control" value="20">
                </div>

            </div>

        </div>
    </div>

    <!-- Headers -->
    <div class="card section-card">
        <div class="card-header">
            Headers
        </div>

        <div class="card-body">

            <table class="table">
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value</th>
                        <th width="120">Action</th>
                    </tr>
                </thead>

                <tbody id="headerTable">

                    <tr>
                        <td>
                            <input class="form-control">
                        </td>

                        <td>
                            <input class="form-control">
                        </td>

                        <td>
                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </td>
                    </tr>

                </tbody>
            </table>

            <button class="btn btn-outline-primary">
                + Add Header
            </button>

        </div>
    </div>

    <!-- Parameters -->
    <div class="card section-card">
        <div class="card-header">
            Parameters
        </div>

        <div class="card-body">

            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Required</th>
                        <th>Value</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>

                        <td>
                            <input class="form-control">
                        </td>

                        <td>
                            <select class="form-select">
                                <option>str</option>
                                <option>int</option>
                                <option>float</option>
                                <option>bool</option>
                                <option>date</option>
                                <option>datetime</option>
                                <option>list</option>
                            </select>
                        </td>

                        <td>
                            <select class="form-select">
                                <option>query</option>
                                <option>body</option>
                                <option>header</option>
                                <option>path</option>
                            </select>
                        </td>

                        <td>
                            <input type="checkbox" class="form-check-input">
                        </td>

                        <td>
                            <input class="form-control">
                        </td>

                        <td>
                            <button class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </td>

                    </tr>

                </tbody>
            </table>

            <button class="btn btn-outline-primary">
                + Add Parameter
            </button>

        </div>
    </div>

    <!-- Output -->
    <div class="card section-card">
        <div class="card-header">
            Output
        </div>

        <div class="card-body">

            <div class="form-floating mb-3">
                <input type="text" class="form-control">
                <label>Filename</label>
            </div>

            <div class="row">

                <div class="col-md-4">
                    <label class="form-label">Format</label>

                    <select class="form-select">
                        <option>csv</option>
                        <option>excel</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Mode</label>

                    <select class="form-select">
                        <option>single_sheet</option>
                        <option>multiple_sheet</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Timestamp Suffix</label>

                    <select class="form-select">
                        <option>true</option>
                        <option>false</option>
                    </select>
                </div>

            </div>

        </div>
    </div>

    <!-- Scheduler -->
    <div class="card section-card">
        <div class="card-header">
            Scheduler
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-6">
                    <label class="form-label">Enable</label>

                    <select class="form-select">
                        <option>true</option>
                        <option>false</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Timezone</label>

                    <input class="form-control"
                           value="Asia/Kolkata">
                </div>

            </div>

            <label class="form-label">
                Days
            </label>

            <div class="mb-3">
                <button class="btn btn-outline-primary">Mon</button>
                <button class="btn btn-outline-primary">Tue</button>
                <button class="btn btn-outline-primary">Wed</button>
                <button class="btn btn-outline-primary">Thu</button>
                <button class="btn btn-outline-primary">Fri</button>
                <button class="btn btn-outline-primary">Sat</button>
                <button class="btn btn-outline-primary">Sun</button>
            </div>

            <label class="form-label">
                Times
            </label>

            <input type="time" class="form-control mb-2">

            <button class="btn btn-outline-primary">
                + Add Time
            </button>

        </div>
    </div>

    <!-- Mailer -->
    <div class="card section-card">
        <div class="card-header">
            Mailer
        </div>

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="form-label">
                        Enable
                    </label>

                    <select class="form-select">
                        <option>true</option>
                        <option>false</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Notify Success
                    </label>

                    <select class="form-select">
                        <option>true</option>
                        <option>false</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Notify Failure
                    </label>

                    <select class="form-select">
                        <option>true</option>
                        <option>false</option>
                    </select>
                </div>

            </div>

            <div class="form-floating mb-3">
                <input class="form-control">
                <label>Sender</label>
            </div>

            <div class="form-floating mb-3">
                <input class="form-control">
                <label>Recipients To</label>
            </div>

            <div class="form-floating">
                <input class="form-control">
                <label>Recipients CC</label>
            </div>

        </div>
    </div>

    <div class="text-end pb-5">
        <button class="btn btn-primary btn-lg">
            Save Job
        </button>
    </div>

</div>

</body>
</html>
